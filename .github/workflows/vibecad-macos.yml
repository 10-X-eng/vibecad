name: VibeCAD macOS Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build."
        required: true
        default: "dev"
        type: string
      architecture:
        description: "macOS architecture to build."
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x86_64
          - both

permissions:
  contents: read

concurrency:
  group: vibecad-macos-${{ inputs.source_ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare macOS Build
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      build_tag: ${{ steps.meta.outputs.build_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Resolve source and architecture matrix
        id: meta
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve ${SOURCE_REF} to a commit: ${source_sha}" >&2
            exit 1
          fi

          python src/Tools/sync_version.py --check
          build_tag="$(python src/Tools/resolve_release_artifact_name.py . --component release-tag)"
          release_title="$(python src/Tools/resolve_release_artifact_name.py . --component release-title)"

          arm64='{"target":"osx-arm64","runner":"macos-15","arch":"arm64"}'
          x86_64='{"target":"osx-64","runner":"macos-15-intel","arch":"x86_64"}'
          case "${ARCHITECTURE}" in
            arm64)
              matrix="{\"include\":[${arm64}]}"
              ;;
            x86_64)
              matrix="{\"include\":[${x86_64}]}"
              ;;
            both)
              matrix="{\"include\":[${arm64},${x86_64}]}"
              ;;
            *)
              echo "Unsupported architecture selection: ${ARCHITECTURE}" >&2
              exit 1
              ;;
          esac

          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "build_tag=${build_tag}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${release_title}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          Build: ${release_title}

          Architecture: ${ARCHITECTURE}
          EOF

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Pixi
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "${HOME}/.pixi/bin" >> "${GITHUB_PATH}"

      - name: Restore Pixi and runtime caches
        id: cache-pixi
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~/.cache/pixi
            ~/.cache/rattler
            ~/Library/Caches/pip
          key: pixi-${{ matrix.target }}-${{ hashFiles('package/rattler-build/pixi.lock', 'package/rattler-build/pixi.toml', 'package/rattler-build/recipe.yaml', 'src/Mod/VibeCAD/requirements.txt', 'package/rattler-build/scripts/install_vibecad_provider_deps.sh', 'package/rattler-build/scripts/install_vibecad_codex_runtime.sh', 'package/rattler-build/scripts/purge_vibecad_retired_authoring_artifacts.sh', 'package/rattler-build/scripts/relocate_conda_environment.py') }}
          restore-keys: |
            pixi-${{ matrix.target }}-

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Build package environment
        shell: bash
        working-directory: package/rattler-build
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_MAXSIZE: "2G"
          MACOS_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          if [[ -d .pixi/envs/default ]]; then
            pixi reinstall -e default vibecad
          else
            pixi install -e default
          fi
          pixi install -e package

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Pixi and runtime caches
        if: always() && steps.cache-pixi.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~/.cache/pixi
            ~/.cache/rattler
            ~/Library/Caches/pip
          key: ${{ steps.cache-pixi.outputs.cache-primary-key }}

      - name: Reclaim macOS packaging workspace
        shell: bash
        working-directory: package/rattler-build
        run: |
          set -euo pipefail
          echo "Rattler build workspace before packaging cleanup:"
          du -sk .pixi/bld
          rm -rf .pixi/bld
          if [[ -d "${RUNNER_TEMP}/ccache" ]]; then
            echo "Compiler cache before packaging cleanup:"
            du -sk "${RUNNER_TEMP}/ccache"
            rm -rf "${RUNNER_TEMP}/ccache"
          fi
          echo "Runner disk space available for macOS packaging:"
          df -h .

      - name: Create and validate VibeCAD DMG
        timeout-minutes: 120
        shell: bash
        working-directory: package/rattler-build
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          MACOS_DEPLOYMENT_TARGET: "12.0"
          MACOS_SIGN_RELEASE: "false"
        run: |
          set -euo pipefail
          pixi run -e package create_bundle

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibecad-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            package/rattler-build/osx/VibeCAD-*.dmg
            package/rattler-build/osx/VibeCAD-*.dmg-SHA256.txt
