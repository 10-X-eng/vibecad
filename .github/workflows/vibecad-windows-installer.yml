name: VibeCAD Windows Build Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to validate."
        required: true
        default: "dev"
        type: string

permissions:
  contents: read

concurrency:
  group: vibecad-windows-validation-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Canonical Metadata
    runs-on: ubuntu-24.04
    outputs:
      build_tag: ${{ steps.meta.outputs.build_tag }}
      release_title: ${{ steps.meta.outputs.release_title }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false

      - name: Resolve version and build
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python src/Tools/sync_version.py --check
          source_sha="$(git rev-parse --verify HEAD)"
          build_tag="$(python src/Tools/resolve_release_artifact_name.py . --component release-tag)"
          release_title="$(python src/Tools/resolve_release_artifact_name.py . --component release-title)"
          {
            echo "build_tag=${build_tag}"
            echo "release_title=${release_title}"
            echo "source_sha=${source_sha}"
          } >> "${GITHUB_OUTPUT}"
          echo "Validating ${release_title}" >> "${GITHUB_STEP_SUMMARY}"

  windows:
    name: Build Windows Bundle and Installer
    needs: metadata
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Pixi
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "${HOME}/.pixi/bin" >> "${GITHUB_PATH}"

      - name: Restore Pixi and Python caches
        id: cache-pixi-windows
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~\AppData\Local\pixi
            ~\AppData\Local\rattler
            ~\AppData\Local\pip\Cache
          key: pixi-windows-${{ hashFiles('package/rattler-build/pixi.lock', 'package/rattler-build/pixi.toml', 'package/rattler-build/recipe.yaml', 'src/Mod/VibeCAD/requirements.txt', 'package/rattler-build/scripts/install_vibecad_provider_deps.sh', 'package/rattler-build/scripts/install_vibecad_codex_runtime.sh', 'package/rattler-build/scripts/purge_vibecad_retired_authoring_artifacts.sh') }}
          restore-keys: |
            pixi-windows-

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-windows-

      - name: Build package environment
        shell: bash
        working-directory: package/rattler-build
        env:
          CCACHE_DIR: ${{ runner.temp }}\ccache
          CCACHE_MAXSIZE: "2G"
        run: |
          set -euo pipefail
          if [[ -d .pixi/envs/default ]]; then
            pixi reinstall -e default vibecad
          else
            pixi install -e default
          fi
          pixi install -e package

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\ccache
          key: ccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create Windows bundle and installer
        shell: bash
        working-directory: package/rattler-build
        env:
          BUILD_TAG: ${{ needs.metadata.outputs.build_tag }}
          MAKE_INSTALLER: "true"
          MAKE_PORTABLE_ARCHIVE: "false"
          WINDOWS_SIGN_RELEASE: "0"
        run: |
          set -euo pipefail
          pixi run -e package create_bundle

      - name: Save Pixi and Python caches
        if: always() && steps.cache-pixi-windows.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            package/rattler-build/.pixi
            package/rattler-build/.download-cache
            ~\AppData\Local\pixi
            ~\AppData\Local\rattler
            ~\AppData\Local\pip\Cache
          key: ${{ steps.cache-pixi-windows.outputs.cache-primary-key }}

      - name: Upload validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibecad-windows-${{ needs.metadata.outputs.build_tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            package/rattler-build/windows/*.exe
            package/rattler-build/windows/*-installer.exe-SHA256.txt
