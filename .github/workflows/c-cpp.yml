name: VibeCAD CMake C++ CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: vibecad-cmake-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-vibecad-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CC: /usr/bin/gcc
      CXX: /usr/bin/g++
      PYTHONPATH: ${{ github.workspace }}/src/Mod/VibeCAD:${{ github.workspace }}/src/Mod/VibeCADAero

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install FreeCAD build dependencies
        run: ./package/ubuntu/install-apt-packages.sh

      - name: Install Python test runner
        run: sudo apt-get install -y python3-pytest

      - name: Configure with CMake
        run: |
          cmake \
            -S . \
            -B build/release \
            -G Ninja \
            --preset release \
            -DFREECAD_USE_EXTERNAL_COIN_PIVY=ON \
            -DFREECAD_USE_EXTERNAL_PYCXX=ON \
            -DFREECAD_USE_EXTERNAL_JSON=ON \
            -DBUILD_TEST=OFF

      - name: Build VibeCAD C++ integration
        run: |
          cmake --build build/release \
            --target VibeCADGeometryWorker VibeCADScripts \
            --parallel 2

      - name: Compile-check VibeCAD Python sources
        run: |
          python3 -m compileall -q src/Mod/VibeCAD
          python3 -m compileall -q src/Mod/VibeCADAero

      - name: Run Host Analysis FEM stabilization tests
        id: host-analysis-fem-tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/test-results
          set +e
          python3 -m pytest -q \
            --junitxml=build/test-results/host-analysis-fem-pytest.xml \
            src/Mod/VibeCAD/vibecad_tests/test_analysis_contracts.py \
            src/Mod/VibeCAD/vibecad_tests/test_analysis_artifacts.py \
            src/Mod/VibeCAD/vibecad_tests/test_analysis_runtime.py \
            src/Mod/VibeCAD/vibecad_tests/test_native_background_commit_gate.py \
            src/Mod/VibeCAD/vibecad_tests/test_fem_analysis_install_activation.py \
            src/Mod/VibeCAD/vibecad_tests/test_calculix_analysis_local_provider.py \
            src/Mod/VibeCAD/vibecad_tests/test_elmer_analysis_local_provider.py \
            src/Mod/VibeCAD/vibecad_tests/test_z88_analysis_local_provider.py \
            src/Mod/VibeCAD/vibecad_tests/test_mystran_analysis_local_provider.py \
            src/Mod/VibeCAD/vibecad_tests/test_analysis_architecture_boundaries.py \
            src/Mod/VibeCAD/vibecad_tests/test_analysis_fem_error_mapping.py \
            src/Mod/VibeCADAero/tests/test_detached_analysis.py \
            2>&1 | tee build/test-results/host-analysis-fem-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### Host Analysis FEM stabilization failure"
              echo
              echo '```text'
              tail -n 120 build/test-results/host-analysis-fem-pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Preserve Host Analysis FEM failure diagnostics
        if: failure() && steps.host-analysis-fem-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: host-analysis-fem-pytest-failure
          path: |
            build/test-results/host-analysis-fem-pytest.log
            build/test-results/host-analysis-fem-pytest.xml
          if-no-files-found: error
          retention-days: 7
